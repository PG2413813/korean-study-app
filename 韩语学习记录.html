<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韩语学习记录</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Malgun Gothic", "Microsoft YaHei", sans-serif;
    font-size: 16px; background: #f5f8f7; color: var(--ink); min-height: 100vh;
  }
  /* ===== 四主题 CSS 变量 ===== */
  body[data-theme="green"]  { --accent:#3fae7e; --accent2:#7fd6ab; --grad:linear-gradient(135deg,#6fd6a4,#33a878); --ink:#24463a; --sub:#6f9384; --sidebar-bg:rgba(22,58,44,.45); --shadow:rgba(40,110,80,.16); }
  body[data-theme="blue"]   { --accent:#3d8fd0; --accent2:#8ecbf0; --grad:linear-gradient(135deg,#7cc4f0,#3d8fd0); --ink:#243c52; --sub:#6f8aa3; --sidebar-bg:rgba(24,52,76,.45); --shadow:rgba(40,80,120,.16); }
  body[data-theme="light"]  { --accent:#4a6b8a; --accent2:#9fb4c6; --grad:linear-gradient(135deg,#6d8aa6,#3f5a75); --ink:#2b3a4a; --sub:#6b7d8d; --sidebar-bg:#2f3f4f; --shadow:rgba(40,50,60,.12); }
  body[data-theme="dark"]   { --accent:#6fd6a4; --accent2:#9be0c4; --grad:linear-gradient(135deg,#56b88f,#2f8a66); --ink:#e6f0ea; --sub:#9fb4aa; --sidebar-bg:rgba(16,24,28,.6); --shadow:rgba(0,0,0,.45); }

  /* 背景层：用户图片 + 柔化渐变 */
  .bg { position: fixed; inset: 0; z-index: 0; background: linear-gradient(135deg,#d8efe2,#cfe6f5); background-size: cover; background-position: center; }
  .bg::after { content:""; position:absolute; inset:0; background: linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,.35)); }

  .app { position: relative; z-index: 1; display: flex; min-height: 100vh; padding: 18px; gap: 18px; }
  .sidebar { width: 200px; flex-shrink: 0; border-radius: 24px; padding: 22px 14px; color: #fff;
    background: var(--sidebar-bg); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid rgba(255,255,255,.22); box-shadow: 0 12px 40px var(--shadow); display: flex; flex-direction: column; }
  .logo { display:flex; align-items:center; gap:10px; font-size: 17px; font-weight: 700; padding: 4px 8px 20px; }
  .logo .dot { width: 26px; height: 26px; border-radius: 9px; background: var(--grad); box-shadow: 0 0 18px rgba(255,255,255,.4); }
  .nav-btn { display: flex; align-items:center; gap:10px; width: 100%; text-align: left; color: rgba(255,255,255,.85); border: 0; border-radius: 14px; padding: 11px 14px; margin: 3px 0; font-size: 14.5px; cursor: pointer; background: transparent; }
  .nav-btn.on { background: linear-gradient(135deg, rgba(255,255,255,.28), rgba(255,255,255,.12)); color: #fff; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  .main { flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-radius: 22px; padding: 16px 22px;
    background: rgba(255,255,255,.5); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,.65); box-shadow: 0 8px 26px var(--shadow); }
  body[data-theme="dark"] .topbar { background: rgba(36,48,54,.5); border-color: rgba(255,255,255,.12); }
  .topbar .greet { font-size: 20px; font-weight: 800; }
  .topbar .greet .kr { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .topbar .gsub { font-size: 13px; color: var(--sub); margin-top: 3px; }
  .topbar .date { font-size: 13px; color: var(--sub); white-space: nowrap; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.6); }
  .hidden { display: none !important; }
  h1.page-title { font-size: 20px; margin-bottom: 14px; }
  .sub { font-size: 13px; color: var(--sub); margin-bottom: 14px; }

  .cards { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .card { flex: 1 1 180px; border-radius: 22px; padding: 20px 22px; position: relative; cursor: pointer;
    background: rgba(255,255,255,.55); backdrop-filter: blur(26px) saturate(190%); -webkit-backdrop-filter: blur(26px) saturate(190%);
    border: 1px solid rgba(255,255,255,.7); box-shadow: 0 10px 30px var(--shadow); transition: transform .2s, box-shadow .2s; }
  body[data-theme="dark"] .card { background: rgba(40,52,58,.55); border-color: rgba(255,255,255,.15); }
  .card:hover { transform: translateY(-3px); box-shadow: 0 16px 38px var(--shadow); }
  .card .num { font-size: 46px; font-weight: 800; line-height: 1.1;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .card .lbl { font-size: 13.5px; color: var(--sub); margin-top: 2px; }
  .card .arrow { position: absolute; right: 18px; top: 18px; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.7); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 14px; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  input, select, textarea { padding: 9px 12px; border: 1px solid rgba(255,255,255,.6); border-radius: 12px; font-size: 15px; background: rgba(255,255,255,.7); font-family: inherit; color: var(--ink); }
  input:focus, select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .btn { padding: 9px 16px; border: 0; border-radius: 12px; background: rgba(255,255,255,.7); font-size: 14.5px; cursor: pointer; color: var(--ink); }
  .btn:hover { background: rgba(255,255,255,.9); }
  .btn.primary { background: var(--grad); color: #fff; font-weight: 600; box-shadow: 0 6px 18px var(--shadow); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { background: #c96a4a; color: #fff; }
  .btn.small { padding: 5px 11px; font-size: 13px; border-radius: 9px; }

  .panel { border-radius: 20px; padding: 16px 18px; background: rgba(255,255,255,.5);
    backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,.65); box-shadow: 0 8px 26px var(--shadow); }
  body[data-theme="dark"] .panel { background: rgba(36,48,54,.5); border-color: rgba(255,255,255,.12); }

  .list { border-radius: 18px; overflow: hidden; background: rgba(255,255,255,.45); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.6); }
  body[data-theme="dark"] .list { background: rgba(30,42,48,.45); }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid rgba(127,127,127,.1); font-size: 15px; }
  .row:last-child { border-bottom: 0; }
  .row .ko { font-weight: 700; min-width: 110px; }
  .row .zh { flex: 1; color: var(--sub); }
  .row .meta { font-size: 13px; color: var(--sub); white-space: nowrap; }
  .row .ops { white-space: nowrap; }
  .tag { font-size: 12px; border: 1px solid rgba(127,127,127,.25); border-radius: 99px; padding: 2px 9px; color: var(--sub); background: rgba(255,255,255,.6); cursor: pointer; }
  .tag.on { background: var(--grad); color: #fff; border-color: transparent; }
  .pill { border: 1px solid rgba(255,255,255,.6); background: rgba(255,255,255,.5); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; }
  .pill.on { background: var(--grad); color: #fff; border-color: transparent; }
  .empty { padding: 26px; text-align: center; color: var(--sub); font-size: 14px; }
  .tip { font-size: 13px; color: var(--sub); margin-top: 10px; line-height: 1.6; }

  .q-prompt { font-size: 52px; font-weight: 800; text-align: center; margin: 24px 0 6px; color: var(--ink); }
  .q-hint { font-size: 13px; color: var(--sub); text-align: center; margin-bottom: 14px; }
  .q-input { display: flex; gap: 10px; justify-content: center; }
  .q-input input { width: 320px; font-size: 18px; text-align: center; }
  /* 复习大卡：撑满居中 */
  .qstage { flex: 1; display: flex; align-items: stretch; justify-content: center; min-height: 460px; }
  .qcard { width: 100%; border-radius: 28px; padding: 56px 48px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(255,255,255,.55); backdrop-filter: blur(28px) saturate(190%); -webkit-backdrop-filter: blur(28px) saturate(190%);
    border: 1px solid rgba(255,255,255,.7); box-shadow: 0 14px 40px var(--shadow); }
  body[data-theme="dark"] .qcard { background: rgba(40,52,58,.55); border-color: rgba(255,255,255,.15); }
  .qcard .qmode { font-size: 13px; letter-spacing: 2px; color: var(--accent); font-weight: 700; margin-bottom: 18px; }
  .qcard .q-prompt { font-size: 68px; margin: 0 0 10px; }
  .qcard .q-hint { margin-bottom: 26px; }
  .qcard .q-input input { width: 380px; font-size: 22px; padding: 12px 16px; }
  .fb { padding: 10px 13px; border-radius: 12px; font-size: 14px; margin-top: 12px; }
  .fb.ok { color: #1f6b43; background: #dff5e8; }
  .fb.no { color: #9a4326; background: #fbe6df; }
  .fb.warn { color: #8a5b1f; background: #fdf3dd; }
  .center { text-align: center; }
  .modal-mask { position: fixed; inset: 0; background: rgba(20,40,34,.35); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; color:#223; border-radius: 16px; padding: 18px; width: 420px; max-width: 92vw; }
  .modal h3 { font-size: 16px; margin-bottom: 12px; }
  .modal label { display: block; font-size: 13px; color: #666; margin: 8px 0 3px; }
  .modal .modal-ops { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .chart-title { font-size: 13px; font-weight: 700; color: var(--sub); margin: 14px 2px 4px; text-align: center; }
  .tval { font-size: 10px; fill: var(--ink); opacity: .85; }
  .tlab { font-size: 10px; fill: var(--sub); }
  .stat-line { font-size: 15px; line-height: 2; }
  .stat-line b { color: var(--accent); }

  /* 今日小卡 */
  .home-extra { display: grid; grid-template-columns: 260px 1fr; gap: 16px; }
  .polaroid { background:#fff; border-radius:14px; padding:10px 10px 14px; transform:rotate(-2deg); box-shadow:0 10px 24px var(--shadow); width:200px; margin:4px auto; }
  .polaroid img { width:180px; height:220px; object-fit:cover; border-radius:8px; display:block; }
  .polaroid .cap { text-align:center; font-size:12.5px; color:#5a8a72; margin-top:8px; font-weight:600; }
  .bar { width:70px; height:7px; border-radius:99px; background:rgba(0,0,0,.08); overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--grad); }
  /* 复习模式选择卡 */
  .mode-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  .mode-card { position: relative; border-radius: 20px; padding: 24px 18px; text-align: center; cursor: pointer;
    background: rgba(255,255,255,.5); border: 2px solid rgba(255,255,255,.5); transition: all .2s; }
  body[data-theme="dark"] .mode-card { background: rgba(40,52,58,.4); border-color: rgba(255,255,255,.1); }
  .mode-card input { position: absolute; opacity: 0; pointer-events: none; }
  .mode-card.on { border-color: var(--accent); background: rgba(255,255,255,.85); box-shadow: 0 10px 26px var(--shadow); }
  body[data-theme="dark"] .mode-card.on { background: rgba(60,80,88,.6); }
  .mode-card .mc-big { font-size: 30px; font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .mode-card .mc-sub { font-size: 13px; color: var(--sub); margin-top: 6px; }

  /* 单词库分页栏 */
  .pager { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .pager .pg-num.on { background: var(--grad); color: #fff; font-weight: 700; }
  .pager .btn.small.disabled { opacity: .4; cursor: default; }
  .pager .pg-gap { color: var(--sub); padding: 0 4px; }
  .pager .pg-info { font-size: 13px; color: var(--sub); }
  .pager .pg-jump { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); }
  .pager .pg-jump input { padding: 5px 8px; font-size: 13px; width: 70px; }
</style>
</head>
<body data-theme="green">
<div class="bg" id="app-bg"></div>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><span class="dot"></span>韩语学习记录</div>
    <nav id="nav">
      <button class="nav-btn on" data-view="home">🏠 首页总览</button>
      <button class="nav-btn" data-view="words">🗂️ 单词库</button>
      <button class="nav-btn" data-view="add">✏️ 每日学习录入</button>
      <button class="nav-btn" data-view="review">🔁 单词复习</button>
      <button class="nav-btn" data-view="errors">⭐ 错题库管理</button>
      <button class="nav-btn" data-view="stats">📊 时间管理</button>
      <button class="nav-btn" data-view="settings">⚙️ 数据与设置</button>
    </nav>
    <div style="margin-top:auto;padding:14px 8px 4px;font-size:12px;opacity:.75">매일 조금씩<br>꾸준히 해요 ♡ 每天一点点</div>
  </aside>
  <main class="main">
    <header id="app-header" class="topbar"></header>
    <section id="view-home" class="view"></section>
    <section id="view-words" class="view hidden"></section>
    <section id="view-add" class="view hidden"></section>
    <section id="view-review" class="view hidden"></section>
    <section id="view-errors" class="view hidden"></section>
    <section id="view-stats" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>
  </main>
</div>
<div id="modal-root"></div>
<script>
/* ==== CORE-START ==== */
'use strict';
var STORAGE_KEY = 'hanStudyApp.v1';

function todayKey(d) {
  d = d || new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function defaultState() {
  return { version: 1, settings: { roundSize: 20, removeAfter: 3 }, words: [], studyLog: {} };
}

function normalizeState(s) {
  var def = defaultState();
  if (!s || typeof s !== 'object') return def;
  s.version = 1;
  s.settings = Object.assign({}, def.settings, s.settings || {});
  s.settings.roundSize = Math.max(1, Math.min(100, s.settings.roundSize | 0 || 20));
  s.settings.removeAfter = Math.max(1, Math.min(10, s.settings.removeAfter | 0 || 3));
  var log = s.studyLog && typeof s.studyLog === 'object' ? s.studyLog : {};
  s.studyLog = log;
  s.words = (Array.isArray(s.words) ? s.words : []).map(function (w) {
    w = w || {};
    return {
      id: String(w.id != null ? w.id : ('w' + Math.random().toString(36).slice(2))),
      ko: String(w.ko || ''),
      zh: String(w.zh || ''),
      tags: Array.isArray(w.tags) ? w.tags.map(String).filter(Boolean) : [],
      createdAt: String(w.createdAt || todayKey()),
      lastReviewedAt: w.lastReviewedAt ? String(w.lastReviewedAt) : null,
      isError: !!w.isError,
      errorSince: w.errorSince ? String(w.errorSince) : null,
      correctStreak: w.correctStreak | 0
    };
  }).filter(function (w) { return w.ko && w.zh; });
  return s;
}

function getStorage(storage) {
  if (storage) return storage;
  if (typeof window !== 'undefined' && window.localStorage) return window.localStorage;
  if (typeof localStorage !== 'undefined') return localStorage;
  return null;
}

function loadState(storage) {
  storage = getStorage(storage);
  var raw = storage ? storage.getItem(STORAGE_KEY) : null;
  if (!raw) {
    var fresh = defaultState();
    if (storage) storage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    return fresh;
  }
  try {
    return normalizeState(JSON.parse(raw));
  } catch (e) {
    var reset = defaultState();
    if (storage) storage.setItem(STORAGE_KEY, JSON.stringify(reset));
    return reset;
  }
}

function saveState(state, storage) {
  storage = getStorage(storage);
  if (storage) storage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function exportJSON(state) {
  return JSON.stringify({ app: 'han-study', version: 1, exportedAt: todayKey(), data: state }, null, 2);
}

function importJSON(text) {
  var parsed;
  try { parsed = JSON.parse(text); }
  catch (e) { return { ok: false, error: '文件不是有效的 JSON：' + e.message }; }
  var data = parsed && (parsed.data || parsed);
  if (!data || typeof data !== 'object') return { ok: false, error: '备份文件缺少数据内容' };
  if (!Array.isArray(data.words)) return { ok: false, error: '备份文件缺少 words 数组' };
  return { ok: true, state: normalizeState(data) };
}

/* ===== 以下为核心算法（DOMAIN） ===== */

function normalizeText(s) { return String(s == null ? '' : s).trim(); }

function splitMeanings(zh) {
  return normalizeText(zh).split(/[、；，,/]/).map(function (s) { return s.trim(); }).filter(Boolean);
}

function judgeAnswer(input, answer, mode) {
  var inp = normalizeText(input);
  if (!inp) return false;
  if (mode === 'zh2ko') return inp === normalizeText(answer);
  return splitMeanings(answer).indexOf(inp) >= 0;
}

function consecutiveStudyDays(studyLog, today) {
  today = today || todayKey();
  var cur = new Date(today + 'T00:00:00');
  function has(key) {
    var r = studyLog[key];
    return !!(r && ((r.added > 0) || (r.reviewed > 0)));
  }
  if (!has(todayKey(cur))) cur.setDate(cur.getDate() - 1);
  var count = 0;
  while (has(todayKey(cur))) { count++; cur.setDate(cur.getDate() - 1); }
  return count;
}

function computeStats(words, studyLog, today) {
  today = today || todayKey();
  var added = (studyLog[today] && studyLog[today].added) || 0;
  var due = 0, errors = 0;
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (w.isError) errors++;
    if (!w.isError && w.createdAt < today && (w.lastReviewedAt == null || w.lastReviewedAt < today)) due++;
  }
  return { newAdded: added, dueReview: due, errorCount: errors, totalWords: words.length, studyDays: consecutiveStudyDays(studyLog, today) };
}

// 取某天学习记录，字段缺失时补默认值（兼容旧备份数据）
function dayLog(studyLog, date) {
  date = date || todayKey();
  var r = studyLog[date] || {};
  return { added: r.added | 0, reviewed: r.reviewed | 0, correct: r.correct | 0, seconds: r.seconds | 0 };
}

// 单日统计：新学 / 复习 / 正确 / 时长 / 掌握率（正确÷复习，无复习时为 null）
function computeDayStats(studyLog, date) {
  var d = dayLog(studyLog, date);
  var rate = d.reviewed > 0 ? Math.round((d.correct / d.reviewed) * 100) : null;
  return { added: d.added, reviewed: d.reviewed, correct: d.correct, seconds: d.seconds, correctRate: rate };
}

function dateOffset(base, n) {
  var d = new Date(base + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return todayKey(d);
}
function weekStartKey(base) {
  var d = new Date(base + 'T00:00:00');
  var wd = d.getDay(); // 0=周日
  d.setDate(d.getDate() - (wd === 0 ? 6 : wd - 1)); // 周一起始
  return todayKey(d);
}
function dateGt(a, b) { return new Date(a + 'T00:00:00') > new Date(b + 'T00:00:00'); }

// 趋势聚合：day=最近N天 / week=最近N周（周一起始）/ month=最近N月
function computeTrend(studyLog, today, mode, span) {
  today = today || todayKey();
  mode = mode || 'day';
  span = span || ({ day: 14, week: 8, month: 12 }[mode] || 14);
  var out = [];
  function empty() { return { added: 0, reviewed: 0, seconds: 0 }; }
  if (mode === 'day') {
    for (var i = 0; i < span; i++) {
      var ds = dateOffset(today, -i);
      var d = dayLog(studyLog, ds);
      out.push({ label: ds.slice(5), date: ds, added: d.added, reviewed: d.reviewed, seconds: d.seconds });
    }
  } else if (mode === 'week') {
    var wkStart = weekStartKey(today);
    for (var j = 0; j < span; j++) {
      var start = dateOffset(wkStart, -j * 7);
      var end = dateOffset(start, 6);
      var agg = empty();
      for (var dd = start; !dateGt(dd, end); dd = dateOffset(dd, 1)) {
        var w = dayLog(studyLog, dd);
        agg.added += w.added; agg.reviewed += w.reviewed; agg.seconds += w.seconds;
      }
      out.push({ label: start.slice(5) + ' 周', added: agg.added, reviewed: agg.reviewed, seconds: agg.seconds });
    }
  } else {
    var curY = parseInt(today.slice(0, 4), 10), curM = parseInt(today.slice(5, 7), 10);
    for (var k = 0; k < span; k++) {
      var mIdx = curM - k;
      var y = curY + Math.floor((mIdx - 1) / 12);
      var m = ((mIdx - 1) % 12 + 12) % 12 + 1;
      var key = y + '-' + String(m).padStart(2, '0');
      var agg2 = empty();
      for (var dayIn = 1; dayIn <= 31; dayIn++) {
        var ds2 = key + '-' + String(dayIn).padStart(2, '0');
        if (dateGt(ds2, today)) break;
        var w2 = dayLog(studyLog, ds2);
        agg2.added += w2.added; agg2.reviewed += w2.reviewed; agg2.seconds += w2.seconds;
      }
      out.push({ label: key, added: agg2.added, reviewed: agg2.reviewed, seconds: agg2.seconds });
    }
  }
  return out;
}

function shuffled(arr, rand) {
  rand = rand || Math.random;
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rand() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function buildReviewQueue(words, settings, today, opts) {
  opts = opts || {};
  today = today || todayKey();
  settings = settings || { roundSize: 20, removeAfter: 3 };
  var size = Math.max(1, settings.roundSize | 0);
  var rand = opts.rand || Math.random;
  var errors = words.filter(function (w) { return w.isError; });
  if (opts.onlyErrors) return shuffled(errors, rand).slice(0, size);
  var normals = words.filter(function (w) {
    return !w.isError && w.createdAt < today && (w.lastReviewedAt == null || w.lastReviewedAt < today);
  });
  normals.sort(function (a, b) {
    var ra = a.lastReviewedAt || '', rb = b.lastReviewedAt || '';
    if (ra < rb) return -1; if (ra > rb) return 1;
    return (a.createdAt < b.createdAt) ? -1 : (a.createdAt > b.createdAt ? 1 : 0);
  });
  if (errors.length >= size) return shuffled(errors, rand).slice(0, size);
  var picked = normals.slice(0, size - errors.length);
  var queue = picked.slice();
  errors.forEach(function (e) {
    var pos = Math.floor(rand() * (queue.length + 1));
    queue.splice(pos, 0, e);
  });
  return queue;
}

function applyAnswer(word, correct, today, settings) {
  today = today || todayKey();
  settings = settings || { removeAfter: 3 };
  var w = Object.assign({}, word);
  if (correct) {
    if (w.isError) {
      w.correctStreak = (w.correctStreak | 0) + 1;
      if (w.correctStreak >= (settings.removeAfter | 0)) {
        w.isError = false; w.errorSince = null; w.correctStreak = 0;
      }
    }
  } else {
    w.isError = true; w.errorSince = today; w.correctStreak = 0;
  }
  return w;
}

function addWordEntry(words, ko, zh, tags, today) {
  today = today || todayKey();
  ko = normalizeText(ko); zh = normalizeText(zh);
  tags = (tags || []).map(normalizeText).filter(Boolean);
  if (!ko || !zh) return { status: 'invalid', words: words };
  var existing = null;
  for (var i = 0; i < words.length; i++) {
    if (normalizeText(words[i].ko) === ko) { existing = words[i]; break; }
  }
  if (existing) return { status: 'duplicate', existing: existing, words: words };
  var next = words.slice();
  next.push({
    id: 'w' + Date.now() + '_' + Math.floor(Math.random() * 1e6),
    ko: ko, zh: zh, tags: tags, createdAt: today,
    lastReviewedAt: null, isError: false, errorSince: null, correctStreak: 0
  });
  return { status: 'added', words: next };
}

function mergeEntry(existing, zh, tags) {
  var w = Object.assign({}, existing);
  var oldM = splitMeanings(w.zh);
  splitMeanings(zh).forEach(function (m) { if (oldM.indexOf(m) < 0) oldM.push(m); });
  w.zh = oldM.join('、');
  var t = {};
  (w.tags || []).concat(tags || []).forEach(function (x) { x = normalizeText(x); if (x) t[x] = 1; });
  w.tags = Object.keys(t);
  return w;
}

// 查找与 item 中文释义完全一致的单词（一个中文对应多个韩语）。
// 规则：释义集合完全相同才算同义（顺序无关）；包含关系不算（A 译"1,2"、B 译"1"，则 A 与 B 不同义）。
function findSynonymGroup(words, item) {
  var target = splitMeanings(item.zh).slice().sort().join('|');
  return (words || []).filter(function (w) {
    if (w.id === item.id) return true;
    var m = splitMeanings(w.zh).slice().sort().join('|');
    return m === target;
  });
}

function probeImages(prefixes, maxN, cb) {
  try {
    if (typeof Image === 'undefined' || typeof location === 'undefined' || location.protocol !== 'file:') { cb([]); return; }
  } catch (e) { cb([]); return; }
  var found = [];
  var total = prefixes.length * maxN;
  if (total <= 0) { cb(found); return; }
  var left = total;
  function maybe() { if (--left <= 0) cb(found); }
  for (var n = 1; n <= maxN; n++) {
    for (var p = 0; p < prefixes.length; p++) {
      (function (n, p) {
        var url = 'backgrounds/' + prefixes[p] + n + '.jpg';
        var img = new Image();
        img.onload = function () { found.push(url); maybe(); };
        img.onerror = maybe;
        img.src = url;
      })(n, p);
    }
  }
}

var IDLE_CHECK_MS = 30000;         // 每30秒检查一次闲置

function fmtDuration(totalSec) {
  totalSec = totalSec | 0;
  var h = Math.floor(totalSec / 3600), m = Math.floor((totalSec % 3600) / 60), s = totalSec % 60;
  if (h > 0) return h + ' 小时 ' + String(m).padStart(2, '0') + ' 分';
  if (m > 0) return m + ' 分 ' + String(s).padStart(2, '0') + ' 秒';
  return s + ' 秒';
}
function timerTick() {
  if (!timerRunning) return;
  var t = ensureDayLog();
  state.studyLog[t].seconds = (state.studyLog[t].seconds || 0) + 1;
  timerTickCount++;
  if (timerTickCount % TICK_PERSIST_EVERY === 0) persist();
  updateTimerDisplay();
}
function timerStart() {
  if (timerRunning) return;
  ensureDayLog();
  timerRunning = true;
  lastActiveTs = Date.now();
  if (!timerTickId) timerTickId = setInterval(timerTick, 1000);
  if (!timerIdleId) timerIdleId = setInterval(idleCheck, IDLE_CHECK_MS);
  renderAll();
}
function timerPause() {
  if (!timerRunning) return;
  timerRunning = false;
  persist();
  if (timerTickId) { clearInterval(timerTickId); timerTickId = null; }
  if (timerIdleId) { clearInterval(timerIdleId); timerIdleId = null; }
  renderAll();
}
function idleCheck() {
  if (timerRunning && Date.now() - lastActiveTs > IDLE_LIMIT_MS) timerPause();
}
function updateTimerDisplay() {
  var el = document.getElementById('timer-display');
  if (el) el.textContent = fmtDuration(AppCore.dayLog(state.studyLog, today()).seconds);
}

    document.addEventListener(ev, function () { if (timerRunning) lastActiveTs = Date.now(); });
  });

}

function saveSession() {
  try {
    if (!session) { localStorage.removeItem(SESSION_KEY); return; }
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      queueIds: session.queue.map(function (w) { return w.id; }),
      index: session.index,
      mode: session.mode,
      correct: session.correct,
      wrong: session.wrong,
      newErrors: session.newErrors,
      answered: session.answered
    }));
  } catch (e) {}
}
function clearSessionStorage() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}
function loadSessionFromStorage() {
  try {
    var raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    var d = JSON.parse(raw);
    if (!d || !Array.isArray(d.queueIds)) return null;
    var queue = d.queueIds.map(function (id) { return findWord(id); }).filter(Boolean);
    if (!queue.length) return null;
    return {
      queue: queue,
      index: Math.max(0, d.index | 0),
      mode: d.mode || 'zh2ko',
      correct: d.correct | 0,
      wrong: d.wrong | 0,
      newErrors: d.newErrors | 0,
      answered: !!d.answered
    };
  } catch (e) { return null; }
}

// 按设置返回顺序或倒序列表（不修改原数组）
function wordsOrdered(list) {
  if (state.settings && state.settings.wordsOrder === 'desc') return list.slice().reverse();
  return list;
}
function toggleWordsOrder() {
  if (!state.settings) state.settings = { roundSize: 20, removeAfter: 3 };
  state.settings.wordsOrder = (state.settings.wordsOrder === 'desc') ? 'asc' : 'desc';
  persist();
  renderAll();
}
function renderWordsList() {
  var q = AppCore.normalizeText(searchQuery);
  var list = state.words.filter(function (w) {
    if (activeTag !== '全部' && w.tags.indexOf(activeTag) < 0) return false;
    if (q && w.ko.indexOf(q) < 0 && w.zh.indexOf(q) < 0) return false;
    return true;
  });
  list = wordsOrdered(list);
  var totalPages = Math.max(1, Math.ceil(list.length / WORDS_PAGE_SIZE));
  if (wordsPage > totalPages) wordsPage = totalPages;
  if (wordsPage < 1) wordsPage = 1;
  var start = (wordsPage - 1) * WORDS_PAGE_SIZE;
  var pageItems = list.slice(start, start + WORDS_PAGE_SIZE);
  var rows = pageItems.length ? pageItems.map(function (w) {
    var tags = w.tags.map(function (t) { return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join(' ');
    return '<div class="row"><span class="ko">' + escapeHtml(w.ko) + '</span><span class="zh">' + escapeHtml(w.zh) + '</span>' +
      '<span class="meta">' + tags + ' ' + escapeHtml(w.createdAt) + (w.isError ? ' <span class="tag">错题</span>' : '') + '</span>' +
      '<span class="ops"><button class="btn small" data-edit="' + w.id + '">编辑</button> <button class="btn small" data-del="' + w.id + '">删除</button></span></div>';
  }).join('') : '<div class="empty">没有匹配的单词</div>';
  $('w-list').innerHTML = rows;
  var editBtns = document.querySelectorAll('#w-list [data-edit]');
  for (var j = 0; j < editBtns.length; j++) {
    editBtns[j].onclick = function () { AppUI.openEdit(this.getAttribute('data-edit')); };
  }
  var delBtns = document.querySelectorAll('#w-list [data-del]');
  for (var k = 0; k < delBtns.length; k++) {
    delBtns[k].onclick = function () { AppUI.confirmRemove(this.getAttribute('data-del')); };
  }
  renderWordPager(list.length, totalPages);
}
function renderWordPager(totalItems, totalPages) {
  var box = $('w-pager');
  if (!box) return;
  if (totalPages <= 1) { box.innerHTML = ''; return; }
  function goto(p) {
    wordsPage = Math.max(1, Math.min(totalPages, p | 0 || 1));
    renderWordsList();
  }
  // 要展示的页码：首页、末页、当前页前后各2页
  var set = {};
  function add(n) { if (n >= 1 && n <= totalPages) set[n] = 1; }
  add(1); add(totalPages);
  for (var d = -2; d <= 2; d++) add(wordsPage + d);
  var nums = Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
  var html = '<div class="pager">';
  html += '<button class="btn small pg-edge' + (wordsPage <= 1 ? ' disabled' : '') + '" id="pg-prev">‹ 上一页</button>';
  var prevN = 0;
  nums.forEach(function (n) {
    if (n - prevN > 1) html += '<span class="pg-gap">…</span>';
    html += '<button class="btn small pg-num' + (n === wordsPage ? ' on' : '') + '" data-pg="' + n + '">' + n + '</button>';
    prevN = n;
  });
  html += '<button class="btn small pg-edge' + (wordsPage >= totalPages ? ' disabled' : '') + '" id="pg-next">下一页 ›</button>';
  html += '<span class="pg-info">共 ' + totalItems + ' 词 / ' + totalPages + ' 页</span>';
  html += '<span class="pg-jump">跳至 <input id="pg-input" type="number" min="1" max="' + totalPages + '"> 页 <button class="btn small primary" id="pg-go">跳转</button></span>';
  html += '</div>';
  box.innerHTML = html;
  if (wordsPage > 1) $('pg-prev').onclick = function () { goto(wordsPage - 1); };
  if (wordsPage < totalPages) $('pg-next').onclick = function () { goto(wordsPage + 1); };
  var nb = box.querySelectorAll('.pg-num');
  for (var i = 0; i < nb.length; i++) {
    nb[i].onclick = function () { goto(Number(this.getAttribute('data-pg'))); };
  }
  $('pg-go').onclick = function () { goto(parseInt($('pg-input').value, 10)); };
  $('pg-input').onkeydown = function (e) { if (e.key === 'Enter') goto(parseInt(this.value, 10)); };
}

  if (AppUI._nowMs() - lastSearchAt > 5000) { searchQuery = ''; wordsPage = 1; }

function startReview(mode) {
  var queue = AppCore.buildReviewQueue(state.words, state.settings, today(), { onlyErrors: onlyErrors });
  if (queue.length === 0) { renderReviewSetup(); return; }
  session = { queue: queue, index: 0, mode: mode || 'zh2ko', correct: 0, wrong: 0, newErrors: 0, answered: false };
  saveSession();
  renderQuestion();
}
function renderQuestion() {
  var item = session.queue[session.index];
  var prompt = session.mode === 'zh2ko' ? item.zh : item.ko;
  var hint = session.mode === 'zh2ko' ? '看中文，写出韩语' : '看韩语，写出中文释义';
  var modeLabel = session.mode === 'zh2ko' ? '중 → 한' : '한 → 중';
  $('view-review').innerHTML =
    '<div class="qstage"><div class="qcard">' +
      '<div class="qmode">' + modeLabel + '　·　第 ' + (session.index + 1) + ' / ' + session.queue.length + ' 题</div>' +
      '<div class="q-prompt">' + escapeHtml(prompt) + '</div>' +
      '<div class="q-hint">' + hint + '</div>' +
      '<div class="q-input"><input id="ans" placeholder="输入答案后按回车或点提交"><button class="btn primary" id="ans-submit">提交</button></div>' +
      '<div id="ans-fb" style="width:100%"></div>' +
      '<div class="center" style="margin-top:14px"><button class="btn hidden" id="ans-next">下一题 →</button></div>' +
    '</div></div>';
  var input = $('ans');
  input.focus();
  input.onkeydown = function (e) {
    if (e.key !== 'Enter') return;
    // 未作答：回车=提交；已作答：回车=下一题（无需鼠标点击）
    if (session.answered) AppUI.nextQuestion();
    else AppUI.submitAnswer(input.value);
  };
  $('ans-submit').onclick = function () { AppUI.submitAnswer(input.value); };
  $('ans-next').onclick = function () { AppUI.nextQuestion(); };
}
function submitAnswer(text) {
  if (!session || session.answered) return;
  // 空输入：误触回车时提醒，不判错、不进错题库、不消耗题目
  if (!AppCore.normalizeText(text)) {
    var fbWarn = $('ans-fb');
    if (fbWarn) fbWarn.innerHTML = '<div class="fb warn">⚠ 还没有输入答案哦，先写下你的答案再按回车</div>';
    return;
  }
  var item = session.queue[session.index];
  var answer = session.mode === 'zh2ko' ? item.ko : item.zh;
  var correct;
  if (session.mode === 'zh2ko') {
    // 一个中文可能对应多个韩语：与同义词组比较，任一韩语都算对
    var group = AppCore.findSynonymGroup(state.words, item);
    session._group = group;
    var inp = AppCore.normalizeText(text);
    correct = group.some(function (g) { return g.ko === inp; });
  } else {
    correct = AppCore.judgeAnswer(text, answer, session.mode);
  }
  var wasError = !!item.isError;
  var updated = AppCore.applyAnswer(item, correct, today(), state.settings);
  updated.lastReviewedAt = today();
  updateWord(item.id, updated);
  recReviewed();
  if (correct) { session.correct++; recCorrect(); } else {
    session.wrong++;
    if (!wasError) session.newErrors++;
  }
  session.answered = true;
  persist();
  saveSession();
  var fb = $('ans-fb');
  var showAnswer = answer;
  if (session.mode === 'zh2ko' && session._group && session._group.length > 1) {
    showAnswer = session._group.map(function (g) { return g.ko; }).join('、');
  }
  if (correct) {
    var hasSyn = session._group && session._group.length > 1;
    if (hasSyn) {
      // 有同义词：展示所有写法让用户确认，不自动跳，按回车/按钮进入下一题
      fb.innerHTML = '<div class="fb ok">✓ 答对了！所有写法：<b>' + escapeHtml(showAnswer) + '</b>　按回车进入下一题</div>';
      $('ans-next').classList.remove('hidden');
    } else {
      fb.innerHTML = '<div class="fb ok">✓ 答对了！自动进入下一题…</div>';
      // 答对：短暂展示反馈后自动进入下一题，无需再按回车
      clearTimeout(AppUI._autoNextTimer);
      AppUI._autoNextTimer = setTimeout(function () { AppUI.nextQuestion(); }, AppUI.AUTO_NEXT_DELAY);
    }
  } else {
    fb.innerHTML = '<div class="fb no">✗ 正确答案：<b>' + escapeHtml(showAnswer) + '</b>（已加入错题）</div>';
    $('ans-next').classList.remove('hidden');
  }
}
function nextQuestion() {
  if (!session) return;
  session.index++;
  session.answered = false;
  saveSession();
  if (session.index >= session.queue.length) renderSummary(); else renderQuestion();
}

var trendMode = 'day';

function svgBars(data, series) {
  var W = 660, H = 205, padL = 36, padR = 12, padT = 26, padB = 34;
  var maxV = 1;
  data.forEach(function (x) {
    series.forEach(function (s) { if (x[s.key] > maxV) maxV = x[s.key]; });
  });
  var iw = W - padL - padR, ih = H - padT - padB;
  var n = data.length, slot = iw / n;
  var groupW = Math.min(40, slot * 0.6);
  var bw = groupW / series.length;
  var rects = '', texts = '', labels = '';
  data.forEach(function (x, i) {
    var cx = padL + slot * i + slot / 2;
    var gx = cx - groupW / 2;
    series.forEach(function (s, j) {
      var h = (x[s.key] / maxV) * ih;
      rects += '<rect x="' + (gx + j * bw + 1) + '" y="' + (H - padB - h) + '" width="' + Math.max(2, bw - 2) + '" height="' + Math.max(0, h) + '" fill="' + s.color + '" rx="2"></rect>';
      if (h > 0) texts += '<text x="' + (gx + j * bw + bw / 2) + '" y="' + (H - padB - h - 4) + '" text-anchor="middle" class="tval">' + x[s.key] + '</text>';
    });
    labels += '<text x="' + cx + '" y="' + (H - padB + 16) + '" text-anchor="middle" class="tlab">' + x.label + '</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">' +
    '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '" stroke="var(--sub)" stroke-opacity=".35"></line>' +
    rects + texts + labels + '</svg>';
}

      '<h3 style="font-size:14px;margin-bottom:8px">备份与恢复</h3>' +
      '<div class="toolbar"><button class="btn primary" id="st-export">导出备份文件</button>' +
      '<label class="btn">导入恢复文件<input type="file" id="st-import" accept=".json,application/json" style="display:none"></label></div>' +
      '<div id="st-msg" class="tip"></div>' +
    '</div>' +
    '<div class="panel" style="margin-top:12px">' +
      '<h3 style="font-size:14px;margin-bottom:8px">偏好设置</h3>' +
      '<div class="toolbar"><span>每轮题量：<input id="st-size" type="number" value="' + state.settings.roundSize + '" style="width:80px"></span>' +
      '<span>连续答对移出次数：<input id="st-after" type="number" value="' + state.settings.removeAfter + '" style="width:80px"></span></div>' +
      '<div class="toolbar"><span style="line-height:32px">主题色：</span>' +
        '<button class="pill' + (curTheme() === 'green' ? ' on' : '') + '" data-th="green">淡绿</button>' +
        '<button class="pill' + (curTheme() === 'blue' ? ' on' : '') + '" data-th="blue">淡蓝</button>' +
        '<button class="pill' + (curTheme() === 'light' ? ' on' : '') + '" data-th="light">浅色</button>' +
        '<button class="pill' + (curTheme() === 'dark' ? ' on' : '') + '" data-th="dark">深色</button></div>' +
      '<div class="toolbar"><button class="btn primary" id="st-save">保存设置</button>' +
      '<button class="btn danger" id="st-reset">恢复默认设置</button></div>' +
    '</div>' +
    '<div class="tip">全部数据仅保存在本机浏览器中，无需登录联网。建议定期导出备份，防止浏览器数据被清理。</div>';
  $('st-export').onclick = function () {
    var text = AppUI.doExport();
    var blob = new Blob([text], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '韩语学习备份_' + today() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    $('st-msg').textContent = '已导出备份文件。';
  };
  $('st-import').onchange = function () {
    var file = this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var text = reader.result;
      openModal(
        '<h3>导入备份</h3><p class="tip" style="font-size:13px">导入将用备份文件覆盖当前全部数据，确定继续吗？</p>' +
        '<div class="modal-ops"><button class="btn" id="im-cancel">取消</button><button class="btn danger" id="im-ok">确认导入</button></div>'
      );
      $('im-cancel').onclick = function () { closeModal(); };
      $('im-ok').onclick = function () {
        var res = AppUI.doImport(text);
        closeModal();
        $('st-msg').textContent = res.ok ? '导入成功。' : ('导入失败：' + res.error);
        if (res.ok) renderSettings();
      };
    };
    reader.readAsText(file, 'utf-8');
  };
  $('st-save').onclick = function () {
    AppUI.saveSettings(parseInt($('st-size').value, 10), parseInt($('st-after').value, 10));
    $('st-msg').textContent = '设置已保存。';
  };
  $('st-reset').onclick = function () {
    AppUI.resetSettings();
    renderSettings();
  };
  var thBtns = document.querySelectorAll('#view-settings [data-th]');
  for (var i = 0; i < thBtns.length; i++) {
    thBtns[i].onclick = function () { setTheme(this.getAttribute('data-th')); renderSettings(); };
  }
}
function doExport() { return AppCore.exportJSON(state); }
function doImport(text) {
  var res = AppCore.importJSON(text);
  if (res.ok) { state = res.state; persist(); }
  return res;
}
function saveSettings(roundSize, removeAfter) {
  state.settings.roundSize = Math.max(1, Math.min(100, roundSize | 0 || 20));
  state.settings.removeAfter = Math.max(1, Math.min(10, removeAfter | 0 || 3));
  persist();
}
function resetSettings() {
  var keepTheme = state.settings && state.settings.theme;
  state.settings = { roundSize: 20, removeAfter: 3 };
  if (keepTheme) state.settings.theme = keepTheme;
  persist();
}

/* ---------- 启动 ---------- */
var AppUI = {
  AUTO_NEXT_DELAY: 700, _autoNextTimer: null,
  navigate: navigate, boot: function () {
    applyTheme(curTheme());
    applyDailyBackground();
    bindTimerEvents();
    var btns = document.querySelectorAll('#nav .nav-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].onclick = (function (v) { return function () { navigate(v); }; })(btns[i].getAttribute('data-view'));
    }
    navigate('home');
  },
  quickAdd: quickAdd, addWord: addWord, mergePending: mergePending,
  toggleWordsOrder: toggleWordsOrder,
  startReview: startReview, submitAnswer: submitAnswer, nextQuestion: nextQuestion,
  doExport: doExport, doImport: doImport, saveSettings: saveSettings, resetSettings: resetSettings,
  openEdit: openEdit, confirmRemove: confirmRemove, renderAll: renderAll,
  _getState: function () { return state; }, _getSession: function () { return session; },
  _setSession: function (s) { session = s; },
  _setOnlyErrors: function (v) { onlyErrors = !!v; },
  _nowMs: function () { return Date.now(); },
  timerStart: timerStart, timerPause: timerPause,
  IDLE_LIMIT_MS: IDLE_LIMIT_MS,
  _timerTick: timerTick, _idleCheck: idleCheck,
  _setLastActive: function (ts) { lastActiveTs = ts; },
  _getTimerState: function () { return { running: timerRunning, seconds: AppCore.dayLog(state.studyLog, today()).seconds }; },
  _reset: function () { state = AppCore.loadState(); timerPause(); searchQuery = ''; activeTag = '全部'; wordsPage = 1; navigate('home'); }
};
AppUI.boot();
/* ==== UI-END ==== */
</script>
</body>
</html>
